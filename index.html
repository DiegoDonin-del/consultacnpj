<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar CNPJ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-3 py-md-4">

    <header class="hero">
      <div>
        <h1><i class="bi bi-building-check me-2"></i>CONSULTA CNPJ</h1>
      </div>
      <div class="d-flex flex-column align-items-start align-items-md-end gap-2">
        <button type="button" class="btn btn-warning btn-sm fw-semibold" id="btn-logs" data-bs-toggle="modal" data-bs-target="#modal-logs">
          <i class="bi bi-journal-text me-1"></i> logs de consumo
        </button>
      </div>
    </header>

    <div class="painel mb-4">
      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-cnpj" data-bs-toggle="tab" data-bs-target="#painel-cnpj" type="button" role="tab">
            <i class="bi bi-search me-1"></i> Por CNPJ
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-busca" data-bs-toggle="tab" data-bs-target="#painel-busca" type="button" role="tab">
            <i class="bi bi-funnel me-1"></i> Buscar com filtros
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-grafo" data-bs-toggle="tab" data-bs-target="#painel-grafo" type="button" role="tab">
            <i class="bi bi-diagram-3 me-1"></i> Vínculos
          </button>
        </li>
      </ul>

      <div class="tab-content p-3 p-md-4">
        <div class="tab-pane fade show active" id="painel-cnpj" role="tabpanel">
          <form id="form-cnpj" class="row g-3 align-items-end" novalidate>
            <div class="col-md-6">
              <label for="cnpj" class="form-label">CNPJ</label>
              <div class="form-text">Digite o CNPJ completo (14 caracteres).</div>
              <input type="text" class="form-control form-control-lg" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" autocomplete="off" required>
            </div>
            
            <div class="col-md-auto">
              <button type="submit" class="btn btn-destaque btn-lg px-4" id="btn-cnpj">
                <span class="rotulo"><i class="bi bi-search me-1"></i> Consultar</span>
                <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-1"></span> Buscando...</span>
              </button>
            </div>
          </form>
          <div id="msg-cnpj" class="mt-3"></div>
          <div id="resultado-cnpj" class="mt-3"></div>
        </div>
        <div class="tab-pane fade" id="painel-busca" role="tabpanel">
          <form id="form-busca" class="row g-3" novalidate>
            <div class="col-6 col-md-2">
              <label for="f-uf" class="form-label">UF</label>
              <select id="f-uf" class="form-select">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label for="f-cnae" class="form-label">CNAE</label>
              <input type="text" id="f-cnae" class="form-control" placeholder="Ex.: 6201501" inputmode="numeric" maxlength="7">
            </div>
            <div class="col-6 col-md-3">
              <label for="f-municipio" class="form-label">Município (IBGE)</label>
              <input type="text" id="f-municipio" class="form-control" placeholder="Ex.: 4204202" inputmode="numeric" maxlength="7">
            </div>
            <div class="col-6 col-md-4">
              <label for="f-natureza" class="form-label">Natureza jurídica</label>
              <select id="f-natureza" class="form-select">
                <option value="">Qualquer</option>
                <option value="2062">Sociedade Empresária Limitada</option>
                <option value="2135">Empresário Individual</option>
                <option value="2305">Empresa Individual de Resp. Limitada</option>
                <option value="2046">Sociedade Anônima Aberta</option>
                <option value="2054">Sociedade Anônima Fechada</option>
                <option value="3999">Associação Privada</option>
              </select>
            </div>
            <div class="col-6 col-md-4">
              <label for="f-cpf" class="form-label">CPF de um sócio</label>
              <input type="text" id="f-cpf" class="form-control" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
            </div>
            <div class="col-6 col-md-3">
              <label for="f-limit" class="form-label">Resultados por página</label>
              <select id="f-limit" class="form-select">
                <option>10</option><option selected>12</option><option>24</option><option>48</option>
              </select>
            </div>
            <div class="col-12 col-md-auto d-flex align-items-end gap-2">
              <button type="submit" class="btn btn-destaque px-4" id="btn-busca">
                <span class="rotulo"><i class="bi bi-funnel me-1"></i> Buscar empresas</span>
                <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-1"></span> Buscando...</span>
              </button>
              <button type="button" class="btn btn-outline-secondary" id="btn-limpar">Limpar</button>
            </div>
          </form>
          <div id="msg-busca" class="mt-3"></div>
          <div id="resultado-busca" class="mt-3"></div>
          <div class="text-center mt-3 d-none" id="mais-wrap">
            <button type="button" class="btn btn-outline-dark" id="btn-mais"><i class="bi bi-plus-circle me-1"></i> Carregar mais</button>
          </div>
        </div>
        <div class="tab-pane fade" id="painel-grafo" role="tabpanel">
          <form id="form-grafo" class="row g-3 align-items-end" novalidate>
            <div class="col-md-6">
              <label for="cnpj-grafo" class="form-label">CNPJ da empresa</label>
              <div class="form-text">Mostra sócios e outras empresas conectadas a ela.</div>
              <input type="text" class="form-control form-control-lg" id="cnpj-grafo" placeholder="00.000.000/0000-00" maxlength="18" autocomplete="off" required>
            </div>
            <div class="col-md-auto">
              <button type="submit" class="btn btn-destaque btn-lg px-4" id="btn-grafo">
                <span class="rotulo"><i class="bi bi-diagram-3 me-1"></i> Ver vínculos</span>
                <span class="carregando d-none"><span class="spinner-border spinner-border-sm me-1"></span> Buscando...</span>
              </button>
            </div>
          </form>
          <div id="msg-grafo" class="mt-3"></div>
          <div id="resultado-grafo" class="mt-3"></div>
        </div>

      </div>
    </div>

    <footer class="rodape">
      <strong id="aluno-nome">Diego Vinicius Donin Quadrado</strong>
      <span class="sep">•</span>
      Fundamentos ao Desenvolvimento Web — Sistemas de Informação — UNOESC
    </footer>
  </div>
  <div class="modal fade" id="modal-logs" tabindex="-1" aria-labelledby="titulo-logs" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="titulo-logs"><i class="bi bi-journal-text me-2"></i>Logs de consumo</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted small" id="logs-info"></span>
            <button type="button" class="btn btn-outline-dark btn-sm" id="btn-atualizar-logs">
              <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
            </button>
          </div>
          <div id="msg-logs"></div>
          <div id="lista-logs"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
